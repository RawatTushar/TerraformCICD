name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:

  # ============================================================
  # CI - Runs on Pull Requests and Pushes to main
  # ============================================================
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Terraform
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ----------------------------------------------------------
      # AWS Authentication using GitHub OIDC
      # Must happen BEFORE Terraform Init because
      # Terraform needs AWS credentials to access the backend.
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Terraform Format
      # ----------------------------------------------------------
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # ----------------------------------------------------------
      # Terraform Validate
      # ----------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate

      # ----------------------------------------------------------
      # TFLint
      # ----------------------------------------------------------
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      # ----------------------------------------------------------
      # Security Scan
      # Terraform files are in repository root
      # ----------------------------------------------------------
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -input=false


  # ============================================================
  # CD - Runs only after merge/push to main
  # ============================================================
  terraform-cd:
    name: Terraform CD
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # ------------------------------------------------------------
    # GitHub Environment
    # Configure required reviewers here:
    # Repository → Settings → Environments → production
    # ------------------------------------------------------------
    environment:
      name: production

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Terraform
      # ----------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ----------------------------------------------------------
      # AWS Authentication using GitHub OIDC
      # Must happen BEFORE Terraform Init
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Terraform Init
      # ----------------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # ----------------------------------------------------------
      # Terraform Plan
      # ----------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      # ----------------------------------------------------------
      # Terraform Apply
      # ----------------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan